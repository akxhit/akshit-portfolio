<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<title>Akshit Manik — Product Designer</title>
<meta name="description" content="Product designer working on mobile and web. Selected case studies.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="page">
  <section class="hero">

    <!-- ============================ PROJECTS COLUMN =========================== -->
    <div class="projects" id="projects"><!-- rendered from content.js --></div>

    <!-- ================================ SIDEBAR ============================== -->
    <aside class="sidebar">

      <!-- ---- pills + morphing panels ---- -->
      <nav class="navpills">
        <div class="pillgroup" data-panel="about">
          <button class="pill" type="button" aria-expanded="false" aria-controls="panel-about">about</button>

          <div class="panel panel--about" id="panel-about" role="dialog" aria-label="About" data-lenis-prevent>
            <div class="panel__inner">
              <div class="ab-top">
                <div class="ab-card">
                  <span class="ab-emoji" id="ab-emoji">👋</span>
                  <div class="ab-photo" id="ab-photo" hidden></div>
                </div>
                <p class="ab-bio" id="ab-bio"></p>
                <div class="ab-list">
                  <div class="ab-listTitle">
                    <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
                      <path d="M9 1.6 11 6l4.8.5-3.6 3.2 1 4.7L9 12l-4.2 2.4 1-4.7L2.2 6.5 7 6z"
                            fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
                    </svg>
                    <span id="ab-listTitle"></span>
                  </div>
                  <ul id="ab-items"></ul>
                </div>
              </div>

              <div class="panel__rule"></div>

              <div class="ab-bottom">
                <p class="ab-logosTitle" id="ab-logosTitle"></p>
                <ul class="ab-logos" id="ab-logos"></ul>
              </div>
            </div>
          </div>
        </div>

        <div class="pillgroup" data-panel="faqs">
          <button class="pill" type="button" aria-expanded="false" aria-controls="panel-faqs">faqs</button>

          <div class="panel panel--faqs" id="panel-faqs" role="dialog" aria-label="FAQs" data-lenis-prevent>
            <div class="panel__inner">
              <p class="faq-title" id="faq-title"></p>
              <div class="panel__rule panel__rule--light"></div>
              <div class="faq-list" id="faq-list"></div>
            </div>
          </div>
        </div>
      </nav>

      <!-- ---- name / tagline / services ---- -->
      <div class="details">
        <div class="details__top">
          <div class="idblock">
            <div class="badges" id="badges"></div>
            <h1 class="bigname" id="bigname"></h1>
          </div>
          <p class="tagline" id="tagline"></p>
        </div>

        <div class="services">
          <div class="services__label">
            <svg viewBox="0 0 21 21" width="21" height="21" aria-hidden="true">
              <rect x="2.5" y="2.5" width="16" height="16" rx="4" fill="none"
                    stroke="currentColor" stroke-width="1.4" stroke-dasharray="3 2.4"/>
            </svg>
            <span id="services-label"></span>
          </div>
          <div class="services__grid" id="services-grid"></div>
        </div>
      </div>

      <!-- ---- CTA + email + socials ---- -->
      <div class="ctablock">
        <div class="ctawrap">
          <button class="cta" type="button" aria-expanded="false" aria-controls="contact-pop">
            <span class="cta__label">Get in Touch</span>
          </button>

          <div class="contactpop" id="contact-pop" role="dialog" aria-label="Contact" data-lenis-prevent>
            <div class="contactpop__inner">
              <div class="cp-top">
                <span class="cp-spots"><i class="cp-dot"></i><span id="cp-spots-label"></span></span>
                <button class="cp-toggle" type="button" hidden>
                  <span class="cp-toggle__label">Book a Call instead</span>
                  <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true">
                    <path d="M4 10h11M11 6l4 4-4 4" fill="none" stroke="currentColor"
                          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
              </div>

              <div class="panel__rule panel__rule--dark"></div>

              <div class="cp-body">
                <form class="cp-form" id="contact-form" novalidate>
                  <label class="field">
                    <span class="field__label">Name</span>
                    <span class="field__box"><input type="text" name="name" placeholder="Jane Smith" required></span>
                  </label>
                  <label class="field">
                    <span class="field__label">Email</span>
                    <span class="field__box"><input type="email" name="email" placeholder="jane@company.com" required></span>
                  </label>
                  <label class="field">
                    <span class="field__label">What do you need help with?</span>
                    <span class="field__box"><textarea name="message" rows="4" placeholder="Hi, I need help with…" required></textarea></span>
                  </label>
                  <label class="check">
                    <input type="checkbox" name="budget">
                    <span class="check__box" aria-hidden="true">
                      <svg viewBox="0 0 12 12" width="12" height="12">
                        <path d="M2.5 6.3 5 8.6l4.5-5" fill="none" stroke="currentColor"
                              stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                      </svg>
                    </span>
                    <span class="check__label">This project has a defined budget</span>
                  </label>
                  <button class="cp-submit" type="submit"><span>Send it over</span></button>
                  <p class="cp-status" id="cp-status" role="status"></p>
                </form>

                <div class="cp-call" hidden><iframe title="Book a call" src="" loading="lazy"></iframe></div>
              </div>
            </div>
          </div>
        </div>

        <div class="contactrow">
          <button class="emailbtn" type="button" id="emailbtn">
            <svg class="emailbtn__icon" viewBox="0 0 20 20" width="17" height="17" aria-hidden="true">
              <rect x="2.5" y="4.5" width="15" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
              <path d="M3.5 6.5 10 11l6.5-4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            <span class="emailbtn__text" id="emailbtn-text"></span>
            <span class="emailbtn__copied" aria-hidden="true">Copied</span>
          </button>
          <div class="socials" id="socials"></div>
        </div>
      </div>
    </aside>
  </section>

  <!-- ================================= FOOTER ================================ -->
  <section class="footerwrap">
    <footer class="footer">
      <div class="footer__row">
        <div class="footer__meta">
          <span class="footer__time" id="clock">—</span>
          <span class="footer__slash">/</span>
          <span class="footer__place" id="place"></span>
        </div>
        <p class="footer__quote" id="quote"></p>
      </div>

      <div class="stickers" id="stickers"></div>

      <div class="footer__row footer__row--bottom">
        <div class="footer__copy">
          <span class="footer__mark" aria-hidden="true"></span>
          <span id="copyright"></span>
        </div>
        <div class="footer__built">
          <a class="hw hw--plain" href="#projects">
            <span class="hw__word">back to the work</span>
            <span class="hw__shine" aria-hidden="true">back to the work</span>
          </a>
        </div>
        <div class="footer__top">
          <button class="totop" type="button" aria-label="Scroll to top">
            <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
              <path d="M9 14.5v-11M4.5 8 9 3.5 13.5 8" fill="none" stroke="currentColor"
                    stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    </footer>
  </section>
</main>

<div class="scrim" id="scrim" hidden></div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/ScrollTrigger.min.js"></script>
<script src="vendor/SplitText.min.js"></script>
<script src="vendor/Draggable.min.js"></script>
<script src="vendor/InertiaPlugin.min.js"></script>
<script src="vendor/CustomEase.min.js"></script>
<script src="vendor/lenis.min.js"></script>

<script src="content.js"></script>
<script src="main.js"></script>
<script src="gradient.js"></script>
<script src="motion.js"></script>
<script src="cat.js"></script>
</body>
</html>
